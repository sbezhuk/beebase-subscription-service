openapi: 3.0.3
info:
  title: BeeBase Subscription Service API
  description: Subscription management service for BeeBase.
  version: 0.2.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: subscription
    description: Subscription endpoints.
  - name: webhooks
    description: Store notification webhook endpoints.

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  /api/v1/subscription:
    get:
      tags: [subscription]
      summary: Get current subscription
      description: Returns current subscription state and entitlement level ("free" or "pro") for the authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Subscription state retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        "401":
          description: Missing or invalid authorization token.
        "500":
          description: Internal server error.

  /api/v1/subscription/verify:
    post:
      tags: [subscription]
      summary: Server-side purchase verification
      description: Verifies an in-app purchase proof (StoreKit 2 signedTransaction for Apple, purchaseToken for Google) and syncs user entitlement.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        "200":
          description: Purchase verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        "400":
          description: Validation error or store verification failure.
        "401":
          description: Missing or invalid authorization token.
        "500":
          description: Internal server error.

  /api/v1/subscription/restore:
    post:
      tags: [subscription]
      summary: Restore purchase
      description: Restores an existing subscription purchase for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        "200":
          description: Purchase restored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        "400":
          description: Validation error or store verification failure.
        "401":
          description: Missing or invalid authorization token.
        "500":
          description: Internal server error.

  /api/v1/subscriptions/webhooks/apple:
    post:
      tags: [webhooks]
      summary: Apple App Store Server Notifications V2
      description: Receives and processes JWS-signed notification events from the Apple App Store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signedPayload
              properties:
                signedPayload:
                  type: string
                  description: JWS-compact encoded App Store Server Notifications V2 payload.
                  example: "eyJhbGciOiJFUzI1NiIsIng1YyI6WyJ...\""
      responses:
        "200":
          description: Notification acknowledged or processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        "400":
          description: Invalid request body or invalid signed payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: "invalid_notification" }
                      message: { type: string, example: "invalid webhook payload" }
        "500":
          description: Internal processing or database error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: "internal_error" }
                      message: { type: string, example: "something went wrong" }

  /api/v1/subscriptions/webhooks/google:
    post:
      tags: [webhooks]
      summary: Google Play Real-Time Developer Notifications (RTDN)
      description: Receives and processes Google Cloud Pub/Sub push messages containing Google Play subscription RTDN events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: object
                  required:
                    - data
                    - messageId
                  properties:
                    data:
                      type: string
                      description: Base64-encoded Google Play DeveloperNotification JSON payload.
                      example: "eyJ2ZXJzaW9uIjoiMS4wIiwicGFja2FnZU5hbWUiOiJjb20uYmVlYmFzZS5wcm9kdWN0aW9uIi...=="
                    messageId:
                      type: string
                      description: Unique Pub/Sub message identifier used for event idempotency.
                      example: "2070443601311540"
                    publishTime:
                      type: string
                      description: RFC3339 timestamp when message was published.
                      example: "2026-09-10T08:00:00.000Z"
                subscription:
                  type: string
                  description: Pub/Sub subscription name.
                  example: "projects/beebase-production/subscriptions/play-rtdn-sub"
      responses:
        "200":
          description: Notification acknowledged or processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        "400":
          description: Invalid request body, malformed envelope, or invalid base64 data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: "invalid_notification" }
                      message: { type: string, example: "invalid webhook payload" }
        "500":
          description: Internal processing, database, or Google API error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: "internal_error" }
                      message: { type: string, example: "something went wrong" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubscriptionResponse:
      type: object
      required:
        - entitlement
      properties:
        entitlement:
          type: string
          enum: [free, pro]
          example: "pro"
        subscription:
          $ref: '#/components/schemas/SubscriptionDetail'

    SubscriptionDetail:
      type: object
      required:
        - id
        - user_id
        - provider
        - product_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [apple, google]
          example: "apple"
        product_id:
          type: string
          example: "beebase_pro_monthly"
        status:
          type: string
          enum: [inactive, active, grace_period, billing_retry, expired, cancelled, revoked]
          example: "active"
        original_transaction_id:
          type: string
        transaction_id:
          type: string
        expires_at:
          type: string
          format: date-time
        auto_renew:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VerifyRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [apple, google]
        signed_transaction:
          type: string
          description: Required for Apple. JWS-encoded transaction from StoreKit 2.
        purchase_token:
          type: string
          description: Required for Google. Purchase token from Google Play Billing.
        subscription_id:
          type: string
          description: Optional Google subscription ID (defaults to beebase_pro).
        package_name:
          type: string
          description: Optional Android package name.

    RestoreRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [apple, google]
        signed_transaction:
          type: string
        purchase_token:
          type: string
        subscription_id:
          type: string
        package_name:
          type: string
